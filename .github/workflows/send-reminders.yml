name: Send booking reminders

# Cada ~10 minutos le pide a la función send-reminders que mande los
# recordatorios de turno que toquen (1 día y 2 horas antes). La función es
# idempotente: cada aviso se reclama una sola vez en la base, así que una
# corrida repetida o atrasada no duplica correos.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call send-reminders
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            "https://pypduwtioxudgepwjvom.supabase.co/functions/v1/send-reminders" \
            -H "Content-Type: application/json" -d '{}'
