<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#05040b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#05040b;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#0d0b18;border:1px solid #2a2547;border-radius:24px;">
            <tr>
              <td style="padding:32px 28px 8px 28px;">
                <div style="font-size:28px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">Clippr</div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0 28px;">
                <h1 style="margin:0;font-size:26px;line-height:1.25;color:#ffffff;">Confirmá tu correo</h1>
                <p style="margin:12px 0 0 0;font-size:17px;line-height:1.5;color:#b9b5d1;">
                  Ya casi estás. Tocá el botón para activar tu cuenta.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:block;text-align:center;background:linear-gradient(90deg,#38bdf8,#8b5cf6);background-color:#7c5cff;color:#ffffff;font-size:18px;font-weight:700;text-decoration:none;padding:16px 24px;border-radius:999px;">
                  Activar mi cuenta
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px 28px;">
                <p style="margin:0;font-size:14px;line-height:1.5;color:#8c88a8;">
                  Si el botón no funciona, copiá y pegá este enlace en tu navegador:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#a99cff;word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
                <p style="margin:16px 0 0 0;font-size:14px;line-height:1.5;color:#8c88a8;">
                  Si no creaste una cuenta en Clippr, ignorá este mensaje.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
